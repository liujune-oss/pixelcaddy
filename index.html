<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Caddy Dashboard</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #ffffff;
            --c-good: #00ff88;
            --c-norm: #ffcc00;
            --c-bad: #ff4444;
            --c-score: #ffffff;
            /* 新增白色变量 */
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 2rem;
        }

        button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .status {
            margin: 20px 0;
            color: #888;
            font-size: 0.9rem;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .card.visible {
            display: block;
        }

        .chart-container {
            position: relative;
            height: 350px;
            /*稍微加高一点*/
            width: 100%;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #444;
        }

        th {
            color: #888;
            font-weight: normal;
            font-size: 0.9rem;
        }

        .score-good {
            color: var(--c-good);
        }

        .score-norm {
            color: var(--c-norm);
        }

        .score-bad {
            color: var(--c-bad);
        }

        .ts {
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Pixel Caddy Sync v1.3</h1>
        <div id="batteryStatus" style="margin-bottom: 15px;">
            <span style="font-size: 1.5rem;">🔋</span>
            <span id="batteryPercent" style="font-size: 1rem; color: #888;">未读取</span>
            <button id="readBatteryBtn" onclick="manualReadBattery()"
                style="font-size: 0.8rem; padding: 4px 10px; margin-left: 10px; display: none;">🔄 手动读取</button>
            <div id="batteryDebug" style="font-size: 0.75rem; color: #666; margin-top: 5px;"></div>
        </div>
        <button id="connectBtn">📡 Connect & Sync</button>
        <div class="status" id="status">Ready to connect...</div>

        <div class="card" id="historyCard">
            <h2>Performance Trend</h2>

            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>

            <div
                style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; border-top: 1px solid #444; padding-top: 20px;">
                <button onclick="refreshData()" style="font-size: 0.9rem; padding: 8px 16px;">🔄 Refresh
                    (Latest)</button>
                <button onclick="loadOlder()" style="font-size: 0.9rem; padding: 8px 16px;">⬇ Load Older</button>
            </div>
            <div id="pageStatus" style="margin-bottom: 10px; font-size: 0.8rem; color: #888;"></div>

            <h3>History</h3>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Group</th>
                        <th>Score</th>
                        <th>Details (G/N/B)</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>

            <div style="margin-top: 30px; border-top: 1px solid #444; padding-top: 20px;">
                <button onclick="clearAllData()" style="background: #ff4444; color: white; font-size: 0.9rem;">
                    ⚠️ Clear All Data on Device
                </button>
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "5fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_HISTORY_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26ac";
        const CHAR_TIME_UUID = "87a7d400-5343-4565-a9b7-1601b0034876";
        const CHAR_BATTERY_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a1";

        let device, server, service, historyChar, timeChar, batteryChar;
        let historyData = {};
        let currentPage = 0;
        let myChart = null;

        document.getElementById('connectBtn').addEventListener('click', connect);

        async function clearAllData() {
            if (!confirm("⚠️ DANGER: This will permanently delete ALL history data on the Pixel Caddy device.\n\nAre you sure you want to continue?")) {
                return;
            }

            if (!historyChar) {
                alert("Device not connected!");
                return;
            }

            try {
                updateStatus("Wiping Data...");
                const encoder = new TextEncoder();
                const data = encoder.encode("WIPE");
                await historyChar.writeValue(data);

                // Clear local data
                historyData = {};
                updateUI();
                alert("Wipe Command Sent. Device should beep to confirm.");
                updateStatus("Data Wiped.");

            } catch (error) {
                console.error("Wipe Failed:", error);
                alert("Failed to send command: " + error.message);
            }
        }

        function initChart() {
            if (myChart) {
                myChart.destroy();
            }
            const ctx = document.getElementById('trendChart').getContext('2d');
            Chart.defaults.color = '#888';
            Chart.defaults.borderColor = '#444';

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Total Score', // 新增分数线
                            data: [],
                            borderColor: '#ffffff', // 白色
                            backgroundColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            yAxisID: 'y1', // 关键：绑定到右侧 Y 轴
                            order: 0 // 确保显示在最上层
                        },
                        {
                            label: 'Good',
                            data: [],
                            borderColor: '#00ff88',
                            backgroundColor: 'rgba(0, 255, 136, 0.05)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true,
                            yAxisID: 'y', // 绑定到左侧 Y 轴
                            order: 1
                        },
                        {
                            label: 'Normal',
                            data: [],
                            borderColor: '#ffcc00',
                            backgroundColor: 'rgba(255, 204, 0, 0.05)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true,
                            yAxisID: 'y',
                            order: 2
                        },
                        {
                            label: 'Bad',
                            data: [],
                            borderColor: '#ff4444',
                            backgroundColor: 'rgba(255, 68, 68, 0.05)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true,
                            yAxisID: 'y',
                            order: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            grid: { display: false }
                        },
                        y: { // 左侧轴：数量
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            suggestedMax: 10,
                            title: {
                                display: true,
                                text: 'Shots Count'
                            }
                        },
                        y1: { // 右侧轴：分数
                            type: 'linear',
                            display: true,
                            position: 'right',
                            min: 0,
                            max: 100, // 固定 0-100 分
                            grid: {
                                drawOnChartArea: false // 不画网格线，避免混乱
                            },
                            title: {
                                display: true,
                                text: 'Total Score',
                                color: '#ffffff'
                            },
                            ticks: {
                                color: '#ffffff'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { font: { size: 12 }, usePointStyle: true }
                        }
                    }
                }
            });
        }

        async function connect() {
            try {
                updateStatus("Searching...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { name: 'Pixel Caddy' },
                        { services: [SERVICE_UUID] }
                    ],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', onDisconnected);
                server = await device.gatt.connect();
                service = await server.getPrimaryService(SERVICE_UUID);

                updateStatus("Subscribing...");
                historyChar = await service.getCharacteristic(CHAR_HISTORY_UUID);
                await historyChar.startNotifications();
                historyChar.addEventListener('characteristicvaluechanged', handleHistoryNotification);

                timeChar = await service.getCharacteristic(CHAR_TIME_UUID);

                try {
                    batteryChar = await service.getCharacteristic(CHAR_BATTERY_UUID);
                    await batteryChar.startNotifications();
                    batteryChar.addEventListener('characteristicvaluechanged', handleBatteryNotification);
                    // 读取初始值
                    const batteryValue = await batteryChar.readValue();
                    const rawStr = new TextDecoder().decode(batteryValue);
                    updateBatteryDisplay(rawStr);
                    document.getElementById('batteryDebug').textContent = '初始读取: "' + rawStr + '"';
                    document.getElementById('readBatteryBtn').style.display = 'inline-block';
                } catch (e) {
                    console.warn("Battery characteristic not available:", e);
                    updateBatteryDisplay(null);
                    document.getElementById('batteryDebug').textContent = '错误: ' + e.message;
                }

                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('historyCard').classList.add('visible');

                initChart();

                // [Fix] Sync Time FIRST, then request data. 
                // This ensures the device has the correct timestamp before sending history.
                updateStatus("Syncing Time...");
                await syncTime().catch(e => console.warn("Time Sync skipped:", e));

                updateStatus("Loading Data...");
                await requestPage(0);

            } catch (error) {
                console.error("Connect Error:", error);
                updateStatus("Error: " + error.message);
            }
        }

        function handleBatteryNotification(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const percent = decoder.decode(value);
            updateBatteryDisplay(percent);
        }

        function updateBatteryDisplay(percent) {
            const el = document.getElementById('batteryPercent');
            const pct = parseInt(percent);
            if (isNaN(pct)) {
                el.textContent = '未读取';
                el.style.color = '#888';
                el.style.fontWeight = 'normal';
                el.style.fontSize = '1rem';
                return;
            }
            // [诊断] 显示 999 表示 BLE 通讯正常但 ADC 未更新
            if (pct === 999) {
                el.textContent = '999 (诊断值)';
                el.style.color = '#ff00ff'; // 紫色
                el.style.fontWeight = 'bold';
                el.style.fontSize = '1.2rem';
                return;
            }
            el.textContent = pct + '%';
            el.style.fontWeight = 'bold';
            el.style.fontSize = '1.2rem';
            // 根据电量变色
            if (pct <= 20) {
                el.style.color = '#ff4444'; // 红色
            } else if (pct <= 50) {
                el.style.color = '#ffcc00'; // 黄色
            } else {
                el.style.color = '#00ff88'; // 绿色
            }
        }

        // [诊断] 手动读取电池值
        async function manualReadBattery() {
            const debugEl = document.getElementById('batteryDebug');
            if (!batteryChar) {
                debugEl.textContent = '错误: 电池特征未初始化';
                return;
            }
            try {
                debugEl.textContent = '读取中...';
                const value = await batteryChar.readValue();
                const rawStr = new TextDecoder().decode(value);
                updateBatteryDisplay(rawStr);
                const now = new Date().toLocaleTimeString();
                debugEl.textContent = `[${now}] 读取成功: "${rawStr}"`;
            } catch (e) {
                debugEl.textContent = '读取失败: ' + e.message;
            }
        }
        async function syncTime() {
            if (!timeChar) return;
            const now = Math.floor(Date.now() / 1000).toString();
            const encoder = new TextEncoder();
            const data = encoder.encode(now);

            console.log("Syncing Time:", now);
            if (timeChar.properties.writeWithoutResponse) {
                await timeChar.writeValueWithoutResponse(data);
            } else {
                await timeChar.writeValue(data);
            }
        }

        async function requestPage(page) {
            currentPage = page;
            updateStatus(`Loading Page ${page}...`);
            if (!historyChar) return;
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(String(page));
                if (historyChar.properties.writeWithoutResponse) {
                    await historyChar.writeValueWithoutResponse(data);
                } else {
                    await historyChar.writeValue(data);
                }
            } catch (error) { console.error("Write Failed:", error); }
        }

        async function refreshData() {
            historyData = {};
            updateUI();
            await requestPage(0);
        }

        async function loadOlder() {
            await requestPage(currentPage + 1);
        }

        function handleHistoryNotification(event) {
            const value = event.target.value;
            const decoder = new TextDecoder('utf-8');
            const jsonStr = decoder.decode(value);
            try {
                const record = JSON.parse(jsonStr);
                if (record && record.i) {
                    historyData[record.i] = record;
                    updateUI();
                }
            } catch (e) { console.log("JSON Error:", e); }
        }

        function updateUI() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let params = Object.values(historyData);

            // Sort by Index Descending (Newest Group First)
            params.sort((a, b) => b.i - a.i);

            if (params.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Waiting for data...</td></tr>';
                return;
            }

            // Prepare Data for Chart
            const chartData = [...params].reverse(); // Oldest to Newest
            const scores = [];

            for (let row of params) {
                const tr = document.createElement('tr');
                const total = row.g + row.n + row.b;
                // Calculate Score (0-100)
                const score = total > 0 ? Math.round((row.g * 100 + row.n * 50) / total) : 0;

                // Date formatting
                const dateObj = new Date(row.ts * 1000);
                const timeStr = row.ts > 0 ? dateObj.toLocaleString('en-US', {
                    month: 'numeric', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                }) : '-';

                tr.innerHTML = `
                    <td>#${row.i}</td>
                    <td style="font-weight:bold">${score}</td>
                    <td>
                        <span class="score-good">${row.g}</span> / 
                        <span class="score-norm">${row.n}</span> / 
                        <span class="score-bad">${row.b}</span>
                    </td>
                    <td class="ts">${timeStr}</td>
                `;
                tbody.appendChild(tr);
            }

            // Update Chart Data
            if (myChart) {
                myChart.data.labels = chartData.map(d => `#${d.i}`);

                // Calculate scores for chart array
                myChart.data.datasets[0].data = chartData.map(d => {
                    const t = d.g + d.n + d.b;
                    return t > 0 ? Math.round((d.g * 100 + d.n * 50) / t) : 0;
                });

                myChart.data.datasets[1].data = chartData.map(d => d.g);
                myChart.data.datasets[2].data = chartData.map(d => d.n);
                myChart.data.datasets[3].data = chartData.map(d => d.b);
                myChart.update();
            }

            document.getElementById('pageStatus').textContent = `Loaded ${params.length} records.`;
            updateStatus("Data Updated.");
        }

        function onDisconnected() {
            updateStatus("Disconnected.");
            document.getElementById('connectBtn').style.display = 'inline-block';
            document.getElementById('historyCard').classList.remove('visible');
        }

        function updateStatus(msg) {
            document.getElementById('status').textContent = msg;
        }
    </script>
</body>

</html>
